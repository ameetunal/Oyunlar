<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05050c" />
  <title>QR Kod Oluşturucu — Link veya Metinden Ücretsiz QR Kod | Araç Kutusu</title>
  <meta name="description" content="Herhangi bir link veya metinden anında QR kod oluşturun ve PNG olarak indirin. Kayıt gerekmez, tamamen ücretsiz." />
  <link rel="icon" href="../icons/icon-192.png" type="image/png" />
  <meta property="og:title" content="QR Kod Oluşturucu | Araç Kutusu" />
  <meta property="og:description" content="Link veya metinden anında QR kod üretin, indirin." />
  <meta property="og:image" content="../og-image.png" />
  <link rel="stylesheet" href="../style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "QR Kod Oluşturucu",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" }
  }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="../" class="nav-brand"><span class="logo-dot"></span>Araç Kutusu</a>
      <a href="../" class="nav-back">← Tüm Araçlar</a>
    </div>

    <div class="card">
      <h1>QR Kod <span class="accent">Oluşturucu</span></h1>
      <p class="lead">Link veya metni yazın — QR kodunuz anında oluşsun.</p>

      <label for="metin">Link veya metin</label>
      <input type="text" id="metin" placeholder="https://example.com" value="https://example.com" />

      <div class="row">
        <div>
          <label for="boyut">Boyut</label>
          <select id="boyut">
            <option value="180">Küçük (180px)</option>
            <option value="256" selected>Orta (256px)</option>
            <option value="384">Büyük (384px)</option>
          </select>
        </div>
        <div>
          <label for="seviye">Hata düzeltme</label>
          <select id="seviye">
            <option value="L">Düşük</option>
            <option value="M" selected>Orta</option>
            <option value="Q">Yüksek</option>
            <option value="H">En Yüksek</option>
          </select>
        </div>
      </div>

      <div id="qr-box" style="background:#fff; border-radius:14px; padding:20px; margin-top:16px; display:flex; align-items:center; justify-content:center;">
        <div id="qrcode"></div>
      </div>

      <div class="row" style="margin-top:14px">
        <button type="button" id="download-btn">⬇ PNG olarak indir</button>
      </div>
    </div>

    <div class="other-tools">
      <h2>Diğer araçlar</h2>
      <div class="chip-row">
        <a class="chip-link" href="../kdv-hesaplama/">KDV Hesaplama</a>
        <a class="chip-link" href="../kredi-hesaplama/">Kredi Taksit Hesaplama</a>
        <a class="chip-link" href="../birim-cevirici/">Birim Çevirici</a>
        <a class="chip-link" href="../yas-hesaplama/">Yaş Hesaplama</a>
        <a class="chip-link" href="../sifre-olusturucu/">Şifre Oluşturucu</a>
        <a class="chip-link" href="../metin-sayaci/">Metin Sayacı</a>
      </div>
    </div>

    <footer class="site-footer">
      <p>Girdiğiniz metin hiçbir sunucuya gönderilmez, QR kod tarayıcınızda üretilir.</p>
    </footer>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
